[project]
name = "controlroom"
version = "0.1.0"
description = "SLOs, multi-window burn-rate alerting and auto-filed incidents for Dior's live apps"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["controlroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
