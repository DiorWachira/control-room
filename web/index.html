<!doctype html>
<html lang="en" data-lights="up">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control Room</title>
  <meta name="description" content="SLOs, error budgets and burn-rate incidents for Resolve, RepoLens and JobBridge.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231B1F18'/%3E%3Crect x='2' y='2' width='5' height='5' fill='%23E59C2F'/%3E%3Crect x='9' y='2' width='5' height='5' fill='%23363A2E'/%3E%3Crect x='2' y='9' width='5' height='5' fill='%23363A2E'/%3E%3Crect x='9' y='9' width='5' height='5' fill='%23F1E8CA'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Share+Tech+Mono&display=swap">
  <script>
    // ?lights=up|down and ?guide=off are for screenshots and demos (see docs/design/README.md).
    try {
      var q = new URLSearchParams(location.search);
      if (q.get("guide") === "off") localStorage.setItem("cr.guide.seen", "1");
      if (q.get("lights")) localStorage.setItem("cr.lights", q.get("lights") === "down" ? "down" : "up");
    } catch (e) {}
    try {
      var l = localStorage.getItem("cr.lights");
      if (!l) l = matchMedia("(prefers-color-scheme: dark)").matches ? "down" : "up";
      document.documentElement.dataset.lights = l;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
